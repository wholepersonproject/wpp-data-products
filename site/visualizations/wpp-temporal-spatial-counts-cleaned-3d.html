<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPP Temporal Spatial Counts 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-dsv@3"></script>
  <script src="wpp-temporal-spatial-counts-cleaned-3d.js"></script>
  <style>
    /* metropolis-latin-400-normal */
    @font-face {
      font-family: 'Metropolis';
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: url(https://cdn.jsdelivr.net/fontsource/fonts/metropolis@latest/latin-400-normal.woff2) format('woff2'), url(https://cdn.jsdelivr.net/fontsource/fonts/metropolis@latest/latin-400-normal.woff) format('woff');
    }

    /* metropolis-latin-500-normal */
    @font-face {
      font-family: 'Metropolis';
      font-style: normal;
      font-display: swap;
      font-weight: 500;
      src: url(https://cdn.jsdelivr.net/fontsource/fonts/metropolis@latest/latin-500-normal.woff2) format('woff2'), url(https://cdn.jsdelivr.net/fontsource/fonts/metropolis@latest/latin-500-normal.woff) format('woff');
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Metropolis;
    }
    .container {
      position: relative;
      /* The cube sits left of center in its plot area and the legends extend past the
         right edge, so shift everything to center the visible content on the page.
         110px was measured from a screenshot; re-measure if #vis size, the camera, or
         the legends change (see notes in the .js file). */
      transform: translateX(-110px);
    }
    #vis {
      width: 800px;
      height: 600px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="vis"></div>
  </div>
  <script>
    wppTemporalSpatial3d('#vis');
  </script>
</body>
</html>
